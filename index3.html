<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Belajar DIV</title>

    <style>
        .container {
            background-color: #FFF4A3;
            width: 50%;
            padding: 10px;
            margin-bottom: 1rem;
        }

        .deskripsi {
            background-color: #4347bc;
            width: 50%;
            padding: 20px;
        }
    </style>
</head>

<body>
    <!-- Contoh penggunaan DIV -->
    <div class="container">
        <h1>Halo nama saya Egal</h1>
        <ul>
            <li>Jurusan: Teknik Informatika</li>
            <li>Umur : 25 Tahun </li>
            <li>Hobi : Coding </li>

            <li>
                <a href="#">Kenalan yuk!</a>
            </li>
        </ul>
    </div>

    <!-- Penggunaan div ke 2 -->
    <div class="deskripsi">
        <h2>Mengenai saya: </h2>
        <p>Hobi saya adalah coding, dan saya suka mempelajari teknologi baru</p>
    </div>



</body>

</html>
