        .services-card .grid-container .item-2,
        .services-card .grid-container .item-3 {
            background-color: #efef8f;
            padding: 2rem;

            display: flex;
            flex-direction: column;
            justify-content: space-between;
            text-align: center;

        }

        .services-card .grid-container img {
            width: 100%;
            height: 500px;
            object-fit: cover;
        }
    </style>
</head>
